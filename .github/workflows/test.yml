name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic-engine:
    name: semantic-engine (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: semantic-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: semantic-engine/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run test:gate
      - run: npm test

  structured-ai:
    name: structured-ai (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20]
    defaults:
      run:
        working-directory: structured-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: structured-ai/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test

