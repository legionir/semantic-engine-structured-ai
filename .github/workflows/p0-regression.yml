name: P0 regression

on:
  pull_request:
    paths:
      - "structured-ai/**"
      - ".github/workflows/p0-regression.yml"
  push:
    branches: [main, roadmap/integration, roadmap/p1, roadmap/p2, roadmap/p3]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every roadmap regression suite is a file test/p<phase>/p<id>*.test.js;
  # the matrix is discovered so an item PR never edits a shared list.
  suites:
    name: Discover roadmap suites
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.find.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        working-directory: structured-ai
        shell: bash
        run: |
          list=$(node -e "const fs=require('fs');const out=[];for(const d of ['p0','p1','p2','p3']){const dir='test/'+d;if(!fs.existsSync(dir))continue;for(const f of fs.readdirSync(dir).sort()){const m=f.match(/^(p[0-9][0-9a-z]*)[.]test[.]js$/);if(m&&m[1].startsWith(d))out.push(m[1]);}}process.stdout.write(JSON.stringify(out))")
          echo "suites: $list"
          echo "list=$list" >> "$GITHUB_OUTPUT"

  p0:
    name: P0 ${{ matrix.suite }} (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: [suites]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # Keep the large Linux/Windows matrix within hosted-runner capacity.
      max-parallel: 12
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
        suite: ${{ fromJSON(needs.suites.outputs.list) }}
    defaults:
      run:
        working-directory: structured-ai
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install
        run: npm ci --ignore-scripts
      - name: Run ${{ matrix.suite }}
        run: |
          set +e
          suite="${{ matrix.suite }}"
          node "test/${suite:0:2}/${suite}.test.js" > out.txt 2>&1
          code=$?
          cat out.txt
          echo "$code" > code.txt
          exit $code
      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-${{ matrix.suite }}-${{ matrix.os }}-${{ matrix.node }}
          path: |
            structured-ai/out.txt
            structured-ai/code.txt
          if-no-files-found: ignore
          retention-days: 7

  full:
    name: Full suite (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    defaults:
      run:
        working-directory: structured-ai
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install
        run: npm ci --ignore-scripts
      - name: Run each npm test file separately
        run: |
          set +e
          node ci/run-tests.js --out out.txt --junit junit.xml
          code=$?
          echo "$code" > code.txt
          exit $code
      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            structured-ai/out.txt
            structured-ai/code.txt
            structured-ai/junit.xml
          if-no-files-found: ignore
          retention-days: 7

  report:
    name: P0 report
    needs: [p0, full]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: results
      - name: Post summary comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const dirs = fs.existsSync('results') ? fs.readdirSync('results').sort() : [];
            const rows = [];
            const detail = {};
            const full = [];
            for (const d of dirs) {
              const fm = d.match(/^full-(?:(.+)-)?node(\d+)$/);
              if (fm) {
                const readF = f => { try { return fs.readFileSync(path.join('results', d, f), 'utf8'); } catch { return ''; } };
                full.push({ os: (fm[1] || 'ubuntu-latest').replace('-latest', ''), node: fm[2], out: readF('out.txt'), code: readF('code.txt').trim() });
                continue;
              }
              const m = d.match(/^p0-(p\d\w*)-(.+)-(\d+)$/);
              if (!m) continue;
              const [, suite, os, node] = m;
              const read = f => { try { return fs.readFileSync(path.join('results', d, f), 'utf8'); } catch { return ''; } };
              const out = read('out.txt');
              const code = read('code.txt').trim();
              const summary = (out.match(/^\s*\d+\/\d+ passed.*$/m) || [''])[0].trim();
              rows.push(`| ${suite} | ${os.replace('-latest','')} | ${node} | ${code === '0' ? '✅' : '❌'} | ${summary || ('exit ' + (code || '?'))} |`);
              const key = suite;
              const fails = out.split('\n').filter((l, i, a) => /FAIL|Error|error:|Cannot find|TypeError|ReferenceError/.test(l)).slice(0, 40).join('\n');
              detail[key] = detail[key] || {};
              detail[key][`${os} / Node ${node}`] = { out, fails };
            }
            let body = '<!-- p0-report -->\n## P0 regression report\n\n| Suite | OS | Node | Result | Summary |\n|---|---|---|---|---|\n' + rows.join('\n') + '\n\n';
            for (const suite of Object.keys(detail).sort()) {
              const envs = detail[suite];
              const ref = envs['ubuntu-latest / Node 22'] || Object.values(envs)[0];
              body += `<details><summary><b>${suite}</b> full output (ubuntu / Node 22)</summary>\n\n\`\`\`\n${(ref.out || '').slice(0, 5000)}\n\`\`\`\n</details>\n\n`;
              for (const [env, v] of Object.entries(envs)) {
                if (env === 'ubuntu-latest / Node 22' || !v.fails) continue;
                body += `<details><summary>${suite} — ${env} failure lines</summary>\n\n\`\`\`\n${v.fails.slice(0, 1500)}\n\`\`\`\n</details>\n\n`;
              }
            }
            if (full.length) {
              full.sort((a, b) => (a.os + a.node).localeCompare(b.os + b.node));
              body += '## structured-ai full suite (each npm test file run separately)\n\n| OS | Node | Result | Summary |\n|---|---|---|---|\n';
              for (const f of full) {
                const s = (f.out.match(/^\s*\d+\/\d+ passed.*$/m) || [''])[0].trim();
                body += `| ${f.os} | ${f.node} | ${f.code === '0' ? '✅' : '❌'} | ${s || ('exit ' + (f.code || '?'))} |\n`;
              }
              body += '\n';
              for (const f of full) {
                const size = f.code === '0' ? 1500 : 9000;
                body += `<details><summary><b>full suite</b> ${f.os} / Node ${f.node} output</summary>\n\n\`\`\`\n${f.out.slice(0, size)}\n\`\`\`\n</details>\n\n`;
              }
            }
            body = body.slice(0, 64000);
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const prev = comments.find(c => c.body && c.body.startsWith('<!-- p0-report -->'));
            if (prev) await github.rest.issues.updateComment({ owner, repo, comment_id: prev.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
