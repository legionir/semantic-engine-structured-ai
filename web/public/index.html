<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0e17">
<title>structured-ai console</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>

<header class="bar">
  <div class="brand">
    <span class="dot" id="statusDot" title="runtime status"></span>
    <strong>structured-ai</strong>
    <span class="status-pill" id="statusText">connecting</span>
    <a class="chip button status-chip" id="gatewayHealth" href="/api/health" title="Gateway health">health · —</a>
    <span class="chip status-chip" id="workspace" title="workspace"></span>
    <span class="chip status-chip" id="model" title="model"></span>
    <span class="chip status-chip" id="turns" title="turns in this session">0 turns</span>
  </div>

  <div class="meta">
    <div class="chip-group">
      <label class="chip select" id="projectSwitcherWrap" title="active project">
        project
        <select id="projectSwitcher">
          <option value="">workspace default</option>
        </select>
      </label>
      <button type="button" id="newProjectButton" class="chip button" title="register a project">
        New Project
      </button>
      <button type="button" id="projectsButton" class="chip button" title="manage projects and open a dashboard">
        Projects
      </button>
    </div>

    <span class="bar-sep" aria-hidden="true"></span>

    <div class="chip-group">
      <button type="button" id="approvalsButton" class="chip alert" hidden>
        approvals <span id="approvalsCount">0</span>
      </button>
    </div>

    <span class="bar-sep" aria-hidden="true"></span>

    <nav class="bar-nav" aria-label="Console views">
      <button type="button" id="historyButton" class="chip button" title="open saved conversations">
        History
      </button>
      <button type="button" id="executionButton" class="chip button" title="open the agent execution tree">
        Execution
      </button>
      <button type="button" id="eventsButton" class="chip button" title="open the event log">
        Events
      </button>
      <button type="button" id="mcpButton" class="chip button" title="connect and inspect MCP servers">
        MCP
      </button>
      <button type="button" id="settingsButton" class="chip button" title="open settings">
        Settings
      </button>
    </nav>
  </div>

  <!-- runtime policy controls live in Settings; this hidden home owns
       their ids while the modal is closed — the settings renderer
       borrows these labels on open and returns them on close -->
  <div class="policy-home" id="policyHome">
    <label class="chip select" title="tool approval policy">
      approval
      <select id="approvalMode">
        <option value="auto">auto</option>
        <option value="prompt">prompt</option>
        <option value="deny">deny</option>
      </select>
    </label>
    <label class="chip checkbox" title="keep starting cycles while the plan has open steps">
      <input type="checkbox" id="autoContinue"> until done
    </label>
  </div>
</header>

<main id="consoleMain">

  <!-- row 1: the conversation, full width -->
  <section class="row conversation-grid">
    <div class="panel conversation">
      <div class="panel-head">
        <h2>Conversation</h2>
        <div class="head-tools">
          <span class="muted" id="sessionTitle"></span>
        </div>
      </div>

      <div id="chat" class="chat">
        <p class="empty">No messages yet. Describe a task to start.</p>
      </div>

      <form id="taskForm" class="composer">
        <textarea id="task" rows="3" placeholder="Describe a task, for example: find the slowest test and explain why"></textarea>
        <div id="taskScope" class="task-scope">
          <label>
            <input type="radio" name="taskScope" value="current" checked>
            Current project
          </label>
          <label>
            <input type="radio" name="taskScope" value="specific">
            Specific project
          </label>
          <select id="taskScopeProject" hidden></select>
          <label>
            <input type="radio" name="taskScope" value="multiple">
            Multiple projects
          </label>
          <span class="kbd-hint" title="run the task from the keyboard"><kbd>Ctrl</kbd><kbd>Enter</kbd></span>
          <div id="taskScopeList" class="task-scope-list" hidden></div>
        </div>
        <div id="discussionOptions" class="discussion-options-row" hidden></div>
        <div class="actions">
          <button type="submit" id="runButton">Run task</button>
          <button type="button" id="cancelButton" class="ghost" disabled>Cancel</button>
          <button type="button" id="discussionButton" class="ghost" title="Multi-agent discussion: specialist personas deliberate in rounds and an observer writes the synthesis">
            Discussion
          </button>
          <button type="button" id="clearButton" class="ghost">New conversation</button>
          <span class="muted grow-right" id="runTimer"></span>
        </div>
      </form>
    </div>

    <div class="panel plan-panel">
      <div class="panel-head">
        <h2>Plan</h2>
        <span class="muted" id="planSummary"></span>
      </div>
      <div id="plan" class="plan-view">
        <p class="empty">No plan yet.</p>
      </div>
    </div>
  </section>

  <!-- row 2: execution and events, hidden; opened as modals from the header -->
  <section class="row split" id="rowTwo" hidden>
    <div class="panel scroller execution-panel">
      <div class="panel-head">
        <h2>Execution</h2>
        <span class="muted" id="execSummary"></span>
      </div>
      <div class="execution-scroll">
        <div id="executionArchive" class="execution-archive"></div>
        <div id="tree" class="tree">
          <p class="empty">No run yet. Send a task to see the agent tree.</p>
        </div>
      </div>
    </div>

    <div class="panel scroller log-panel">
      <div class="panel-head">
        <h2>Events</h2>
        <div class="head-tools">
          <input type="search" id="logFilter" class="filter" placeholder="filter by any part of a word">
          <select id="logType" class="filter" title="show only one kind of event">
            <option value="">all types</option>
          </select>
          <span class="muted" id="logCount" hidden></span>
          <button type="button" id="clearLog" class="link">clear</button>
        </div>
      </div>
      <ul id="log" class="log"></ul>
    </div>
  </section>

</main>

<section id="projectDashboard" class="project-dashboard" hidden>
  <div class="dashboard-head">
    <div class="head-tools">
      <button type="button" id="dashboardBack" class="ghost">Back to console</button>
    </div>
    <h2 id="dashboardTitle">Project</h2>
    <p id="dashboardSubtitle" class="muted"></p>
  </div>
  <nav id="dashboardTabs" class="dashboard-tabs" aria-label="Project dashboard"></nav>
  <div id="dashboardBody" class="dashboard-body"></div>
</section>

<script src="/modal.js"></script>
<script type="module" src="/app/main.js"></script>
</body>
</html>
