<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e17">
<meta name="description" content="Autonomous coding agent runtime with multi-layer delegation, sandboxed tool execution, MCP integration, and real-time web console.">
<meta property="og:title" content="Structured-ai v5">
<meta property="og:description" content="Autonomous coding agent runtime with multi-layer delegation, sandboxed tool execution, MCP integration, and real-time web console.">
<script>document.documentElement.classList.add("auth-pending");</script>
<title>structured-ai console</title>
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/styles/panels.css">
<link rel="stylesheet" href="/styles/execution.css">
<link rel="stylesheet" href="/styles/dialogs.css">
<link rel="stylesheet" href="/styles/projects.css">
<link rel="stylesheet" href="/styles/composition.css">
<link rel="stylesheet" href="/styles/operator.css">
<link rel="stylesheet" href="/vendor/xterm.css">
<link rel="stylesheet" href="/console-login.css">
</head>
<body>

<header class="bar" id="consoleHeader">
  <div class="brand">
    <span class="dot" id="statusDot" title="runtime status"></span>
    <strong>structured-ai</strong>
    <span class="status-pill" id="statusText">connecting</span>
    <a class="chip button status-chip" id="gatewayHealth" href="/api/health" title="Gateway health">—</a>
    <button type="button" id="mobileMenuToggle" class="mobile-menu-toggle" aria-label="Open console menu" aria-expanded="false">☰</button>
  </div>

  <div class="status-strip" aria-label="Runtime status">
    <span class="chip status-chip" id="model" title="model"></span>
    <span class="chip status-chip" id="autoSwitchStatus" title="automatic continuation">auto-switch · off</span>
    <span class="chip status-chip" id="turns" title="turns in this session">0 turns</span>
  </div>

  <div class="meta" id="consoleMenu">
    <button type="button" id="approvalsButton" class="chip alert" hidden>
      approvals <span id="approvalsCount">0</span>
    </button>
    <!-- ordered by how often each is used: everyday work, watching a run,
         configuration, then the account (sign out is always last) -->
    <nav class="bar-nav" aria-label="Console views">
      <span class="bar-nav-sep first" role="separator" aria-label="Work" data-label="Work"></span>
      <button type="button" id="commandPaletteButton" class="chip button" title="search commands and views (Ctrl+K)">Commands</button>
      <button type="button" id="historyButton" class="chip button" title="open saved conversations">History</button>
      <button type="button" id="templatesButton" class="chip button" title="save and load reusable task templates" aria-label="Task templates">Templates</button>
      <button type="button" id="filesButton" class="chip button" title="browse and edit workspace files">Files</button>
      <button type="button" id="terminalButton" class="chip button" title="open a system terminal in the workspace">Terminal</button>
      <span class="bar-nav-sep" role="separator" aria-label="Monitor" data-label="Monitor"></span>
      <button type="button" id="planButton" class="chip button" title="open the plan">Plan</button>
      <button type="button" id="executionButton" class="chip button" title="open the agent execution tree">Execution</button>
      <button type="button" id="eventsButton" class="chip button" title="open the event log">Events</button>
      <button type="button" id="logsButton" class="chip button" title="application log: AI request errors, failures, crashes">Logs <span id="logsBadge" class="logs-badge" hidden>0</span></button>
      <button type="button" id="systemButton" class="chip button" title="CPU, memory, disk, runs and background processes">System</button>
      <span class="bar-nav-sep" role="separator" aria-label="Configure" data-label="Configure"></span>
      <button type="button" id="settingsButton" class="chip button" title="open runtime settings">Settings</button>
      <button type="button" id="llmSettingsButton" class="chip button" title="LLM providers, layers, and proxy">LLM settings</button>
      <button type="button" id="mcpButton" class="chip button" title="connect and inspect MCP servers">MCP</button>
      <button type="button" id="skillsButton" class="chip button" title="choose which skills are sent to the AI; /skill &lt;name&gt; attaches one to a message">Skills</button>
      <button type="button" id="notificationsButton" class="chip button" title="browser notifications when a conversation in the background finishes, fails or needs an approval" aria-pressed="false">Notify · off</button>
      <span class="bar-nav-sep" role="separator" aria-label="Account" data-label="Account"></span>
      <button type="button" id="logoutButton" class="chip button logout-button" title="sign out of the console on this browser">Sign out</button>
    </nav>
  </div>

  <!-- Hidden mirror for until done; approval/plan mode lives in the composer toolbar. -->
  <div class="policy-home" id="policyHome">
    <label class="chip checkbox" title="keep starting cycles while the plan has open steps">
      <input type="checkbox" id="autoContinue"> until done
    </label>
  </div>
</header>

<main id="consoleMain">

  <!-- row 1: the conversation, full width -->
  <section class="row conversation-grid">
    <div class="panel conversation">
      <div class="panel-head">
        <h2>Conversation</h2>
        <div class="head-tools">
          <span class="muted" id="sessionTitle"></span>
        </div>
      </div>

      <div id="conversationTabs" class="conversation-tabs-host"></div>

      <div id="interruptedBanner" class="interrupted-host"></div>

      <div id="chat" class="chat">
        <p class="empty">No messages yet. Describe a task to start.</p>
      </div>

      <div id="planApproval" class="plan-approval-host"></div>

      <div id="messageQueue" class="message-queue-host"></div>

      <form id="taskForm" class="composer">
        <div class="attachment-list" id="attachmentList" aria-live="polite"></div>
        <textarea id="task" rows="3" placeholder="Describe a task, for example: find the slowest test and explain why. Type @ to point at a file; paste a screenshot to attach it" aria-autocomplete="list" aria-controls="mentionList" aria-expanded="false"></textarea>
        <ul id="mentionList" class="mention-list" role="listbox" aria-label="Files matching the @ mention" hidden></ul>
        <div class="composer-tools" aria-label="Task tools and mode">
          <label class="chip select composer-mode" title="Tool approval policy (auto, prompt, or deny) or Plan mode">
            <span>Mode</span>
            <select id="approvalMode" aria-label="Approval or plan mode">
              <option value="auto">auto</option>
              <option value="prompt">prompt</option>
              <option value="deny">deny</option>
              <option value="plan">plan</option>
            </select>
          </label>
          <button type="button" id="taskChangesButton" class="chip button" title="What each task changed in the workspace; revert a whole task" aria-label="Task changes"><span>Changes</span></button>
          <button type="button" id="reviewButton" class="chip button" title="Review the current diff, a branch, a commit or a pull request" aria-label="Review"><span>Review</span></button>
        </div>
        <div class="composer-advanced" id="composerAdvanced">
          <div class="run-options" id="runOptions">
            <label class="effort-control" for="taskEffort">
              <span>Effort</span>
              <select id="taskEffort" aria-label="Reasoning effort for all agent layers">
                <option value="inherit" selected>inherit</option>
                <option value="low">low</option>
                <option value="medium">medium</option>
                <option value="high">high</option>
                <option value="xhigh">extra high</option>
              </select>
            </label>
            <label class="effort-control" for="taskMaxCost" title="Stop the run when it has cost this many dollars (empty: the server setting)">
              <span>Cap $</span>
              <input type="number" id="taskMaxCost" min="0" step="0.05" placeholder="—" aria-label="Dollar cap for the run">
            </label>
            <span class="effort-control raw-control">
              <span>Response</span>
              <button type="button" id="chatFormatToggle" class="raw-toggle" aria-pressed="false" title="Switch between rendered Markdown preview and raw text for agent responses">Raw · off</button>
            </span>
          </div>
        </div>
        <div class="actions">
          <button type="submit" id="runButton">Run task</button>
          <button type="button" id="queueButton" class="ghost" title="Add this message to the project's queue for the next turn" hidden>Queue message</button>
          <button type="button" id="correctButton" class="ghost" title="Send the text to the running turn: the agent reads it before its next step" hidden>Correct now</button>
          <button type="button" id="discussionButton" class="ghost" title="Multi-agent discussion: specialist personas deliberate in rounds and an observer writes the synthesis">
            Discussion
          </button>
          <button type="button" id="composerOptionsToggle" class="ghost composer-options-toggle" aria-expanded="false" aria-controls="composerAdvanced">Options</button>
          <button type="button" id="attachFilesButton" class="ghost icon-only" title="Attach files to the next task" aria-label="Attach files"></button>
          <input type="file" id="attachmentInput" multiple hidden>
          <span class="muted grow-right" id="runTimer"></span>
          <span class="run-cost" id="runCost" aria-live="polite"></span>
        </div>
      </form>
    </div>

    <div class="panel plan-panel" id="planPanel">
      <div class="panel-head">
        <h2>Plan</h2>
        <span class="muted" id="planSummary"></span>
      </div>
      <div id="plan" class="plan-view">
        <p class="empty">No plan yet.</p>
      </div>
    </div>
  </section>

</main>

<footer class="project-bar" id="projectBar" aria-label="Project and task controls">
  <div class="project-actions">
    <button type="button" id="clearButton" class="chip button" title="start a new conversation" aria-label="New conversation"><span>New conversation</span></button>
    <button type="button" id="projectsButton" class="chip button" title="manage projects" aria-label="Projects"><span>Projects</span></button>
    <button type="button" id="newProjectButton" class="chip button" title="register a project" aria-label="New project"><span>New Project</span></button>
  </div>
  <div class="project-bar-info">
    <div class="project-active-label" id="activeProjectName" aria-live="polite">Default Workspace</div>
    <span class="project-workspace-path" id="workspace" title="workspace"></span>
  </div>
</footer>

<section id="consoleLogin" class="console-login" hidden>
  <form id="consoleLoginForm" class="console-login-card">
    <h1>Sign in</h1>
    <p>Enter the web console password to continue.</p>
    <label for="consolePassword">Password</label>
    <input id="consolePassword" name="password" type="password" autocomplete="current-password" required autofocus>
    <p id="consoleLoginError" class="console-login-error" role="alert" hidden></p>
    <button id="consoleLoginButton" type="submit">Continue</button>
  </form>
</section>

<section id="projectDashboard" class="project-dashboard" hidden>
  <div class="dashboard-head">
    <div class="head-tools">
      <button type="button" id="dashboardBack" class="ghost">Back to console</button>
    </div>
    <h2 id="dashboardTitle">Project</h2>
    <p id="dashboardSubtitle" class="muted"></p>
  </div>
  <nav id="dashboardTabs" class="dashboard-tabs" aria-label="Project dashboard"></nav>
  <div id="dashboardBody" class="dashboard-body"></div>
</section>

<script src="/modal.js"></script>
<script src="/auth-gate.js"></script>
</body>
</html>
