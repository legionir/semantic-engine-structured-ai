[package]
name = "web-engine-desktop"
version = "0.1.0"
edition = "2021"
description = "Web Engine - Tauri desktop wrapper"

dependencies = {
  tauri = { version = "1", features = ["shell-open", "dialog-open", "dialog-save", "fs-read-file", "fs-write-file", "path-all"] },
  serde = { version = "1", features = ["derive"] },
  serde_json = "1"
}

[build-dependencies]
tauri-build = { version = "1", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
