<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#16213e">
  <title>Web Engine</title>
  <base href="/">

  <!--
    Runtime configuration for the web client. Everything the client needs is a
    `<meta>` tag instead of a bundler define, so the same build can be served by
    the Vite dev server, by `apps/server` from `dist/`, or from any static host:
    only these tags change. See apps/web/src/config.ts for the keys.
  -->
  <meta name="web-engine:api-base-url" content="/api">
  <meta name="web-engine:project-id" content="default">
  <meta name="web-engine:renderer" content="auto">
  <meta name="web-engine:username" content="guest">
  <meta name="web-engine:auto-start" content="true">

  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <!-- Manifest and service worker are generated by apps/server (`src/pwa`). -->
  <link rel="manifest" href="/api/manifest.json">
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
  <div id="app">
    <header id="toolbar">
      <span class="brand">Web Engine</span>
      <span class="chip">web</span>
      <span class="spacer"></span>
      <button id="btn-play" type="button" title="Start the frame loop (Space)">Play</button>
      <button id="btn-pause" type="button" title="Pause the frame loop (Space)" disabled>Pause</button>
      <button id="btn-save" type="button" title="Save the scene locally (Ctrl/Cmd+S)">Save</button>
      <button id="btn-push" type="button" title="Upload the scene to apps/server" disabled>Push</button>
      <button id="btn-reset" type="button" title="Rebuild the demo scene">Reset</button>
      <label class="toggle"><input id="chk-spin" type="checkbox" checked><span>Spin</span></label>
      <label class="toggle"><input id="chk-lights" type="checkbox" checked><span>Lights</span></label>
    </header>

    <main id="stage">
      <canvas id="viewport" aria-label="Web Engine viewport"></canvas>
      <aside id="hud" aria-live="polite"></aside>
      <div id="loading-screen">
        <div class="title">Web Engine</div>
        <div class="sub">Booting renderer…</div>
      </div>
      <div id="toast" role="status" hidden></div>
    </main>
  </div>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
