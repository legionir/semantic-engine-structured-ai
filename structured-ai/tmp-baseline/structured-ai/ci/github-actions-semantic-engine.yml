name: semantic-engine

on:
  push:
    branches: ["**"]
    paths:
      - "semantic-engine/**"
      - "ci/github-actions-semantic-engine.yml"
  pull_request:
    paths:
      - "semantic-engine/**"
      - "ci/github-actions-semantic-engine.yml"

defaults:
  run:
    working-directory: semantic-engine

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: semantic-engine/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      # Guards that must never regress. They need no fixture and no
      # native module, so they are a hard gate rather than a report.
      - name: Contract guards
        run: npx jest src/core/types --ci

      # Every suite runs as of phase 24. The SQLiteExporter tests used
      # to be excluded because they needed a native sqlite3 build; they
      # now use the driver layer, which prefers the SQLite built into
      # Node. On Node 20 that built-in does not exist, so the optional
      # sqlite3 dependency still covers that leg of the matrix.
      - name: Test suite
        # نه `npm test` خالی: سوئیتی که کامپایل نشود صفر تست گزارش می‌کند،
        # پس شمار تست‌ها سبز می‌ماند در حالی که سوئیت مرده است. این گیت
        # روی «چند سوئیت اجرا شد» شکست می‌خورد، نه فقط روی «چند تست».
        # SE-BUILD-11.
        run: npm run test:gate

      # The golden files record what the pipeline emits for the fixture.
      # Phases after this one change that output on purpose, and each is
      # expected to re-record with the diff reviewed by hand.
      - name: Golden snapshot
        run: npm run snapshot

      # A real workspace benchmark protects the resource budget in addition
      # to the small deterministic fixture used by the snapshot.
      - name: Performance budget
        run: SEMANTIC_BENCHMARK_ROOT=. SEMANTIC_BENCHMARK_MAX_MS=120000 node scripts/benchmark.js
